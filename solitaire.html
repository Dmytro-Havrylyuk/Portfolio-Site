<meta charset="UTF-8">
<title>Solitaire</title>
<style>

  var SHEET_COLS=13, SHEET_ROWS=4;
  var SUIT_ROW={C:0,D:1,S:2,H:3};
  var cardImages={};
  var imagesReady=false;

  function prepareCardImages(callback){
    var img=new Image();
    img.onload=function(){
      var sw=img.naturalWidth, sh=img.naturalHeight;
      var cw=Math.floor(sw/SHEET_COLS), ch=Math.floor(sh/SHEET_ROWS);
      SUITS.forEach(function(s){
        for(var r=1;r<=13;r++){
          var canvas=document.createElement('canvas');
          canvas.width=cw; canvas.height=ch;
          var ctx=canvas.getContext('2d');
          ctx.fillStyle='#fff';
          ctx.fillRect(0,0,cw,ch);
          ctx.drawImage(img, (r-1)*cw, SUIT_ROW[s]*ch, cw, ch, 0, 0, cw, ch);
          cardImages[s+'_'+r]=canvas.toDataURL();
        }
      });
      imagesReady=true;
      callback();
    };
    img.src=CARD_IMG;
  }

  function makeCardFace(card){
    var img=document.createElement('img');
    img.src=cardImages[card.suit+'_'+card.rank];
    img.draggable=false;
    img.style.cssText='width:100%;height:100%;display:block;background:#fff;';
    return img;
  }

  function playSound(src){
    if(!SETTINGS.sound) return;
    try{ var a=new Audio(src); a.volume=0.6; a.play().catch(function(){}); }catch(e){}
  }
  function playDeal(){ playSound(DEAL_SND); }
  function playMove(){ playSound(MOVE_SND); }
  var SETTINGS={scoring:'standard', draw:'draw3', timer:true, sound:true, leftHanded:false, vegasCumulative:false};
  try{ var savedSettings=JSON.parse(localStorage.getItem('xpSolitaireSettings_v1')||'null'); if(savedSettings) Object.assign(SETTINGS,savedSettings); }catch(e){}
  function saveSettings(){ try{ localStorage.setItem('xpSolitaireSettings_v1',JSON.stringify(SETTINGS)); }catch(e){} }
  function startTimer(){
    if(!SETTINGS.timer || gameWon || timerId) return;
    timerId=setInterval(function(){
      seconds++;
      var t=document.getElementById('timeVal'); if(t) t.textContent=fmtTime(seconds);
      if(SETTINGS.scoring==='standard' && seconds%10===0 && !checkWin()) addScore(-2);
    },1000);
  }
  function stopTimer(){
    if(timerId){ clearInterval(timerId); timerId=null; }
  }
  var lastState=null;
  function pushHistory(){
    if(!state) return;
    lastState=JSON.stringify(state);
  }
  function undo(){
    if(!lastState || !state) return;
    stopCascade();
    state=JSON.parse(lastState);
    lastState=null;
    normalStatus();
    render();
  }

  function buildDeck(){
    var d=[];
    for(var s=0;s<SUITS.length;s++){ for(var r=1;r<=13;r++){ d.push({suit:SUITS[s],rank:r,faceUp:false}); } }
    return d;
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  }
  function normalStatus(){
    if(!state) return;
    statusBar.style.justifyContent='flex-end';
    statusBar.innerHTML='Score: <span id="scoreVal">'+state.score+'</span>&nbsp;&nbsp;Moves: <span id="moveVal">'+(state.moves||0)+'</span>&nbsp;&nbsp;Time: <span id="timeVal">'+fmtTime(seconds)+'</span>';
  }
  function cascadeStatus(){
    if(!state) return;
    statusBar.style.justifyContent='space-between';
    statusBar.innerHTML='<span>Bonus: 0</span><span>Press Esc or a mouse button to stop...</span><span>Score: '+state.score+'</span>';
  }
  function addScore(n){
    if(SETTINGS.scoring==='none') return;
    state.score += n;
    if(SETTINGS.scoring==='standard') state.score=Math.max(0,state.score);
    var s=document.getElementById('scoreVal'); if(s) s.textContent=state.score;
  }
  function incMove(){
    if(!state) return;
    state.moves=(state.moves||0)+1;
    var m=document.getElementById('moveVal'); if(m) m.textContent=state.moves;
  }

  function stopCascade(){
    if(cascadeRAF) cancelAnimationFrame(cascadeRAF);
    if(cascadeLaunchTimer) clearInterval(cascadeLaunchTimer);
    cascadeRAF=null; cascadeLaunchTimer=null;
    cascadeActive=[];
    if(cascadeLayer && cascadeLayer.parentNode) cascadeLayer.parentNode.removeChild(cascadeLayer);
    cascadeLayer=null;
    trailNodes=[];
    board.style.minHeight='300px';
    document.removeEventListener('keydown', escStop);
    normalStatus();
  }
  function escStop(e){ if(e.key==='Escape') newGame(); }

  function newGame(){
    stopCascade();
    var deck=buildDeck();
    shuffle(deck);
    lastState=null;
    gameScoringMode=SETTINGS.scoring;
    gameCounted=true;
    STATS.gamesPlayed++;
    saveStats();
    var startingScore=(gameScoringMode==='vegas' ? (SETTINGS.vegasCumulative && STATS.vegas.totalScore!==null ? STATS.vegas.totalScore : -52) : 0);
    state={ stock:[], waste:[], foundations:{S:[],H:[],D:[],C:[]}, tableau:[[],[],[],[],[],[],[]], score:startingScore, passCount:1, moves:0 };
    seconds=0;
    gameWon=false;
    autoFinishRunning=false;
    if(autoFinishTimer) { clearInterval(autoFinishTimer); autoFinishTimer=null; }
    stopTimer();
    startTimer();
    var idx=0;
    for(var col=0; col<7; col++){
      for(var row=0; row<=col; row++){
        var card=deck[idx++];
        card.faceUp=(row===col);
        state.tableau[col].push(card);
      }
    }
    state.stock=deck.slice(idx);
    normalStatus();
    render();
    animateDeal();
  }

  function animateDeal(){
    var cards=board.querySelectorAll('[data-zone="tableau"] > div');
    cards.forEach(function(el,i){
      el.style.transition='none';
      el.style.opacity='0';
      el.style.transform='translate(-30px,-50px)';
      setTimeout(function(){
        el.style.transition='transform 0.22s ease-out, opacity 0.18s ease-out';
        el.style.opacity='1';
        el.style.transform='translate(0,0)';
      }, i*30);
    });
    for(var k=0;k<7;k++){
      setTimeout(playDeal, k*150);
    }
  }

  function drawStock(){
    if(state.stock.length===0 && state.waste.length===0) return;
    if(state.stock.length===0){
      var maxPasses = SETTINGS.draw==='draw3' ? 3 : 1;
      if(SETTINGS.scoring==='vegas' && state.passCount>=maxPasses) return;
      pushHistory();
      state.passCount=(state.passCount||1)+1;
      if(SETTINGS.scoring==='standard'){
        if(SETTINGS.draw==='draw1'){ addScore(-100); }
        else if(state.passCount>3){ addScore(-20); }
      }
      state.waste.reverse();
      for(var i=0;i<state.waste.length;i++){ state.waste[i].faceUp=false; }
      state.stock=state.waste; state.waste=[];
    } else {
      pushHistory();
      var n = SETTINGS.draw==='draw3' ? 3 : 1;
      for(var k=0;k<n && state.stock.length>0;k++){
        var card=state.stock.pop(); card.faceUp=true; state.waste.push(card);
      }
    }
    incMove();
    render();
    playMove();
    var wtc=board.querySelector('.waste-top-card');
    if(wtc){
      wtc.style.transform='scaleX(0)';
      requestAnimationFrame(function(){
        wtc.style.transition='transform 0.15s ease-out';
        wtc.style.transform='scaleX(1)';
      });
    }
  }

  function canStackTableau(destCol, card){
    if(destCol.length===0) return card.rank===13;
    var top=destCol[destCol.length-1];
    return top.faceUp && card.rank===top.rank-1 && isRed(card)!==isRed(top);
  }
  function canStackFoundation(pile, card){
    if(pile.length===0) return card.rank===1;
    var top=pile[pile.length-1];
    return card.suit===top.suit && card.rank===top.rank+1;
  }
  function isValidSequence(cards){
    for(var i=0;i<cards.length-1;i++){
      if(cards[i+1].rank!==cards[i].rank-1 || isRed(cards[i+1])===isRed(cards[i])) return false;
    }
    return true;
  }

      if(state.waste.length===0) return false;
      card=state.waste[state.waste.length-1];
    } else {
      var t=state.tableau[col];
      if(t.length===0 || !t[t.length-1].faceUp) return false;
      card=t[t.length-1];
    }
    if(canStackFoundation(state.foundations[card.suit], card)){
      pushHistory();
      if(sourceType==='waste'){ state.waste.pop(); }
      else { state.tableau[col].pop(); var nc=state.tableau[col]; if(nc.length>0 && !nc[nc.length-1].faceUp){ nc[nc.length-1].faceUp=true; if(SETTINGS.scoring!=='none') addScore(5); } }
      state.foundations[card.suit].push(card);
      addScore(SETTINGS.scoring==='vegas' ? 5 : 10);
      incMove();
      playMove();
      render();
      if(checkWin()){ finishGame(); }
      return true;

    return false;
  }

  function render(){
    board.innerHTML='';
    var topRow=document.createElement('div');
    topRow.style.cssText='display:flex;gap:'+GAP+'px;margin-bottom:'+GAP+'px;';

    var wasteEl=makeSlot();
    wasteEl.style.overflow='visible';
    if(state.waste.length>0){
      var showCount = SETTINGS.draw==='draw3' ? Math.min(3,state.waste.length) : 1;
      var startIdx = state.waste.length-showCount;
      for(var wi=0; wi<showCount; wi++){

    SUITS.forEach(function(s){
      var fEl=makeSlot(); fEl.setAttribute('data-zone','foundation'); fEl.setAttribute('data-suit',s);
      var pile=state.foundations[s];
      if(pile.length>0){
        var fCard=pile[pile.length-1];
        var fCardEl=makeCardEl(fCard,0,0);
        attachDrag(fCardEl,'foundation',s,pile.length-1);

      else { fEl.innerHTML='<div style="color:#cfe8d8;font-size:20px;text-align:center;line-height:'+CH+'px;">'+FOUND_SYM[s]+'</div>'; }

    if(SETTINGS.leftHanded){ foundationEls.forEach(function(el){ topRow.appendChild(el); }); topRow.appendChild(spacer); topRow.appendChild(wasteEl); topRow.appendChild(stockEl); }

      });

  var drag=null;
  function attachDrag(el,srcType,col,idx){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var group;
      if(srcType==='waste'){
        group=[state.waste[state.waste.length-1]];
      } else if(srcType==='foundation'){
        var foundationPile=state.foundations[col];
        if(idx!==foundationPile.length-1 || foundationPile.length===0) return;
        group=[foundationPile[foundationPile.length-1]];
      } else {
        var colArr=state.tableau[col];
        var seq=colArr.slice(idx);
        if(!isValidSequence(seq) && idx!==colArr.length-1) return;
        group=seq;
      }
      var elRect=el.getBoundingClientRect(), boardRect0=board.getBoundingClientRect();
      drag={ srcType:srcType, col:col, idx:idx, group:group, startX:e.clientX, startY:e.clientY, moved:false,
             origX:elRect.left-boardRect0.left, origY:elRect.top-boardRect0.top };
      var layer=document.createElement('div');
      layer.style.cssText='position:absolute;top:0;left:0;pointer-events:none;z-index:50;';
      layer.id='dragTmpLayer';
      board.appendChild(layer);
      drag.ghosts=[];
      group.forEach(function(card,gi){
        var g=makeCardEl(card,0,0); g.style.zIndex=51+gi; g.style.display='none';
        layer.appendChild(g); drag.ghosts.push(g);
      });
      positionGhosts(e.clientX,e.clientY);
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
    });
  }
  function positionGhosts(clientX,clientY){
    var boardRect=board.getBoundingClientRect();
    var x=clientX-boardRect.left-CW/2, y=clientY-boardRect.top-CH/3;
    drag.ghosts.forEach(function(g,gi){ g.style.left=x+'px'; g.style.top=(y+gi*FAN)+'px'; });
  }
  document.addEventListener('pointermove', function(e){
    if(!drag) return;
    var dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
    if(!drag.moved && Math.sqrt(dx*dx+dy*dy)>5){
      drag.moved=true;
      drag.ghosts.forEach(function(g){ g.style.display='block'; });
    }
    if(drag.moved) positionGhosts(e.clientX,e.clientY);
  });
  document.addEventListener('pointerup', function(e){
    if(!drag) return;
    var d=drag; drag=null;
    var layer=document.getElementById('dragTmpLayer');
    if(!d.moved){
      if(layer && layer.parentNode) layer.parentNode.removeChild(layer);
      return;
    }
    var target=document.elementFromPoint(e.clientX,e.clientY);
    var zoneEl=target ? target.closest('[data-zone]') : null;
    var success=false;
    if(zoneEl){
      var zone=zoneEl.getAttribute('data-zone');
      if(zone==='foundation' && d.group.length===1){
        var suit=zoneEl.getAttribute('data-suit');
        var pile=state.foundations[suit];
        if(d.group[0].suit===suit && canStackFoundation(pile,d.group[0])){
          pushHistory();
          removeFromSource(d);
          pile.push(d.group[0]);
          addScore(SETTINGS.scoring==='vegas' ? 5 : 10);
          incMove();
          success=true;
        }
      } else if(zone==='tableau'){
        var destCol=parseInt(zoneEl.getAttribute('data-col'),10);
        if(!(d.srcType==='tableau' && d.col===destCol)){
          var dest=state.tableau[destCol];
          if(canStackTableau(dest,d.group[0])){
            pushHistory();
            removeFromSource(d);
            d.group.forEach(function(c){ dest.push(c); });
            if(d.srcType==='waste') addScore(5);
            else if(d.srcType==='foundation') addScore(-15);
            incMove();
            success=true;
          }
        }
      }
    }
    if(success){
      if(layer && layer.parentNode) layer.parentNode.removeChild(layer);
      playMove();
      render();
      if(checkWin()){ finishGame(); }
    } else {
      d.ghosts.forEach(function(g,gi){
        g.style.transition='left 0.18s ease-out, top 0.18s ease-out';
        g.style.left=d.origX+'px';
        g.style.top=(d.origY+gi*FAN)+'px';
      });
      setTimeout(function(){
        if(layer && layer.parentNode) layer.parentNode.removeChild(layer);
      }, 190);
    }
  });
  function removeFromSource(d){
    if(d.srcType==='waste'){
      state.waste.pop();
    } else if(d.srcType==='foundation'){
      state.foundations[d.col].pop();
    } else {
      var colArr=state.tableau[d.col];
      colArr.length=d.idx;
      if(colArr.length>0 && !colArr[colArr.length-1].faceUp){
        colArr[colArr.length-1].faceUp=true;
        if(SETTINGS.scoring!=='none') addScore(5);
      }
    }
  }

  function finishGame(){
    if(gameWon) return;
    gameWon=true;
    if(timerId) { clearInterval(timerId); timerId=null; }
    if(gameScoringMode==='standard' && seconds>30){
      addScore(Math.floor(700000/seconds));
    }
    if(gameCounted){
      STATS.gamesWon++;
      var rec=STATS[gameScoringMode==='vegas'?'vegas':'standard'];
      rec.wins++;
      if(rec.bestScore===null || state.score>rec.bestScore) rec.bestScore=state.score;
      if(rec.bestTime===null || seconds<rec.bestTime) rec.bestTime=seconds;
      rec.totalWinTime+=seconds;
      if(gameScoringMode==='vegas') rec.totalScore=state.score;
      STATS.history.unshift({mode:gameScoringMode,score:state.score,time:seconds,date:new Date().toISOString()});
      STATS.history=STATS.history.slice(0,50);
      saveStats();
    }
    startCascade();
  }

  function canAutoFinishNow(){
    if(!state || gameWon || autoFinishRunning) return false;
    // Safe auto-finish shortcut: only when there are no face-down tableau cards
    // and no cards left in the stock/waste. Every remaining tableau card can then
    // be advanced to its foundation in rank order.
    if(state.stock.length!==0 || state.waste.length!==0) return false;
    for(var c=0;c<state.tableau.length;c++){
      for(var r=0;r<state.tableau[c].length;r++){
        if(!state.tableau[c][r].faceUp) return false;
      }
    }
    return true;
  }

  function autoFinish(){
    if(!canAutoFinishNow()) return false;
    autoFinishRunning=true;
    var moved=false;
    function step(){
      var found=false;
      for(var ci=0;ci<state.tableau.length && !found;ci++){
        var pile=state.tableau[ci];
        if(pile.length===0) continue;
        var card=pile[pile.length-1];
        if(canStackFoundation(state.foundations[card.suit],card)){
          pushHistory();
          pile.pop();
          state.foundations[card.suit].push(card);
          addScore(SETTINGS.scoring==='vegas' ? 5 : 10);
          incMove();
          found=true; moved=true;
        }
      }
      if(found){
        playMove();
        render();
        if(checkWin()){ autoFinishRunning=false; finishGame(); return; }
        autoFinishTimer=setTimeout(step,90);
      } else {
        autoFinishRunning=false;
        autoFinishTimer=null;
      }
    }
    step();
    return moved;
  }

  function stampCard(card,x,y){
    var el=makeTrailEl(card,x,y);
    cascadeLayer.appendChild(el);
    trailNodes.push(el);
    if(trailNodes.length>MAX_TRAIL){
      var old=trailNodes.shift();
      if(old.parentNode) old.parentNode.removeChild(old);
    }
  }

  function startCascade(){
    stopCascade();
    board.style.minHeight=CASCADE_H+'px';
    cascadeLayer=document.createElement('div');
    cascadeLayer.style.cssText='position:absolute;inset:0;z-index:200;';
    board.appendChild(cascadeLayer);
    var W=board.clientWidth, H=CASCADE_H;
    var seqCards=[];
    for(var r=1;r<=13;r++){ SUITS.forEach(function(s){ seqCards.push({suit:s,rank:r}); }); }
    var i=0;
    cascadeLayer.style.pointerEvents='auto';
    cascadeLayer.onclick=function(){ newGame(); };
    document.addEventListener('keydown', escStop);
    cascadeStatus();

    function tick(){
      for(var k=cascadeActive.length-1;k>=0;k--){
        var c=cascadeActive[k];
        c.vy += 0.7;
        c.x += c.vx; c.y += c.vy;
        if(c.y+CH > H && c.bounces<c.maxBounces){
          c.y=H-CH; c.vy=-Math.abs(c.vy)*0.6; c.bounces++;
        }
        if(c.x < 0){ c.x=0; c.vx=Math.abs(c.vx); }
        if(c.x + CW > W){ c.x=W-CW; c.vx=-Math.abs(c.vx); }
        if(c.y > H){ cascadeActive.splice(k,1); continue; }
        stampCard(c.card, c.x, c.y);
      }
      cascadeRAF=requestAnimationFrame(tick);
    }
    tick();

    cascadeLaunchTimer=setInterval(function(){
      if(i>=seqCards.length){ clearInterval(cascadeLaunchTimer); cascadeLaunchTimer=null; return; }
      launchCard(seqCards[i], W);
      i++;
    }, 25);
  }

  function launchCard(card, W){
    var slot=board.querySelector('[data-zone="foundation"][data-suit="'+card.suit+'"]');
    var boardRect=board.getBoundingClientRect();
    var startX, startY;
    if(slot){
      var slotRect=slot.getBoundingClientRect();
      startX=slotRect.left-boardRect.left;
      startY=slotRect.top-boardRect.top;
    } else { startX=W/2; startY=0; }
    var vx=(Math.random()*7-3.5);
    var vy=-(8+Math.random()*4);
    var maxBounces=3+Math.floor(Math.random()*3);
    cascadeActive.push({ card:card, x:startX, y:startY, vx:vx, vy:vy, bounces:0, maxBounces:maxBounces });
  }

      '<tr><td style="padding:4px;">Best time</td><td style="text-align:center;">'+fmtTime(STATS.standard.bestTime)+'</td><td style="text-align:center;">'+fmtTime(STATS.vegas.bestTime)+'</td></tr>'+
      '<tr><td style="padding:4px;">Average time</td><td style="text-align:center;">'+avgTime('standard')+'</td><td style="text-align:center;">'+avgTime('vegas')+'</td></tr>'+
      '<tr><td style="padding:4px;">Cumulative Vegas</td><td style="text-align:center;">—</td><td style="text-align:center;">'+STATS.vegas.totalScore+'</td></tr>';
    body.appendChild(table);
    var hist=document.createElement('div'); hist.style.cssText='border:1px solid #888;padding:8px;max-height:110px;overflow:auto;';
    hist.innerHTML='<b>Recent completed games</b><br>'+(STATS.history.length?STATS.history.slice(0,10).map(function(h){return h.mode+' — '+h.score+' pts, '+fmtTime(h.time);}).join('<br>'):'No completed games yet.'); body.appendChild(hist);
    box.appendChild(body);
    var row=document.createElement('div'); row.style.cssText='display:flex;justify-content:center;gap:10px;padding:0 14px 14px;';
    var reset=document.createElement('button'); reset.textContent='Reset Stats'; reset.style.cssText='padding:4px 12px;cursor:pointer;'; reset.onclick=function(){ if(confirm('Reset all Solitaire statistics?')){ STATS={gamesPlayed:0,gamesWon:0,standard:{wins:0,bestScore:null,bestTime:null,totalWinTime:0},vegas:{wins:0,bestScore:null,bestTime:null,totalWinTime:0,totalScore:0},history:[]}; saveStats(); closeStatsDialog(); openStatsDialog(); } };
    var ok=document.createElement('button'); ok.textContent='OK'; ok.style.cssText='padding:4px 20px;cursor:pointer;'; ok.onclick=closeStatsDialog; row.appendChild(reset); row.appendChild(ok); box.appendChild(row);
    statsDialog.appendChild(box); solWindow.appendChild(statsDialog);
  }
  function closeStatsDialog(){ if(statsDialog && statsDialog.parentNode) statsDialog.parentNode.removeChild(statsDialog); statsDialog=null; }
  var helpDialog=null;
  function openHelpDialog(){
    if(helpDialog) return;
    helpDialog=document.createElement('div');
    helpDialog.style.cssText='position:absolute;inset:0;background:rgba(0,0,0,0.35);z-index:500;display:flex;align-items:center;justify-content:center;';
    var box=document.createElement('div');
    box.style.cssText='background:#d4d0c8;border:2px solid #0a246a;border-radius:2px;width:340px;box-shadow:2px 2px 8px rgba(0,0,0,0.5);';
    var titleBar=document.createElement('div');
    titleBar.style.cssText='background:linear-gradient(180deg,#1c54bd,#0a3a8b);color:#fff;font-size:12px;font-weight:500;padding:3px 8px;';
    titleBar.textContent='How to Play';
    box.appendChild(titleBar);
    var body=document.createElement('div');
    body.style.cssText='padding:12px 14px;font-size:12px;color:#000;line-height:1.5;max-height:320px;overflow-y:auto;';
    body.innerHTML =
      '<p style="margin:0 0 8px;"><b>Goal:</b> Move all 52 cards onto the 4 piles on the top right, sorted Ace to King, one suit per pile.</p>' +
      '<p style="margin:0 0 8px;"><b>Tableau:</b> Drag a card onto another that is one rank higher and the opposite color (e.g. a red 6 onto a black 7). A group of cards already in sequence can be dragged together.</p>' +
      '<p style="margin:0 0 8px;"><b>Empty columns:</b> Only a King can be placed on an empty column.</p>' +
      '<p style="margin:0 0 8px;"><b>Stock and Waste:</b> Click the deck (top left) to draw. In Draw Three, only the top card of the three is playable.</p>' +
      '<p style="margin:0 0 8px;"><b>Foundations:</b> Drag or double-click a card to send it to its suit pile once it is in order.</p>' +
      '<p style="margin:0;"><b>Game menu:</b> New (F2) starts over, Undo reverses your last move only, Deck... changes the card back, Options... sets scoring (Standard, Vegas, or None) and draw style.</p>';
    box.appendChild(body);
    var btnRow=document.createElement('div');
    btnRow.style.cssText='display:flex;justify-content:center;padding:0 14px 14px;';
    var okBtn=document.createElement('button');
    okBtn.textContent='OK'; okBtn.style.cssText='padding:4px 20px;cursor:pointer;';
    okBtn.addEventListener('click', closeHelpDialog);
    btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
    helpDialog.appendChild(box);
    solWindow.appendChild(helpDialog);
  }
  function closeHelpDialog(){
    if(helpDialog && helpDialog.parentNode) helpDialog.parentNode.removeChild(helpDialog);
    helpDialog=null;
  }
  document.getElementById('helpMenu').addEventListener('click', openHelpDialog);

  document.getElementById('gameMenu').addEventListener('click', function(e){ e.stopPropagation(); toggleGameMenu(); });
  document.addEventListener('keydown', function(e){ if(e.key==='F2' && imagesReady) newGame(); });
  document.getElementById('testWinBtn').addEventListener('click', function(){
    if(!imagesReady || !state) return;
    stopCascade();
    if(timerId) clearInterval(timerId);
    state.tableau=[[],[],[],[],[],[],[]];
    state.stock=[]; state.waste=[];
    state.foundations={S:[],H:[],D:[],C:[]};
    SUITS.forEach(function(s){
      for(var r=1;r<=13;r++){ state.foundations[s].push({suit:s,rank:r,faceUp:true}); }
    });
    render();
    startCascade();
  });

  prepareCardImages(newGame);
})();
</script>
</body>
</html>
